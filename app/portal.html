<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compliance & Identity Search Engine</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg: #f4f6f9;
            --surf1: #ffffff;
            --surf2: #f8f9fa;
            --text: #2d3748;
            --muted: #718096;
            --bdr: #e2e8f0;
            --accent: #3182ce;
            --success: #38a169;
            --success-bg: #c6f6d5;
            --danger: #e53e3e;
            --danger-bg: #fed7d7;
            --danger-bdr: #feb2b2;
        }

        html.dark, body.dark-theme {
            --bg: #121214;
            --surf1: #1a1a1e;
            --surf2: #24242b;
            --text: #e2e8f0;
            --muted: #a0aec0;
            --bdr: #2d3748;
            --accent: #4299e1;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            transition: background 0.2s, color 0.2s;
            display: flex;
            justify-content: center;
        }

        .portal-container {
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
        }

        .card {
            background: var(--surf1);
            border: 1px solid var(--bdr);
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
            margin-bottom: 20px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        h2, h3 { margin: 0; font-weight: 600; }

        #themeToggle {
            background: var(--surf2);
            border: 1px solid var(--bdr);
            color: var(--text);
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
        }

        .search-box {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 12px;
            margin-bottom: 16px;
        }

        @media (max-width: 500px) {
            .search-box { grid-template-columns: 1fr; }
        }

        input[type="text"] {
            background: var(--surf2);
            color: var(--text);
            border: 1px solid var(--bdr);
            padding: 14px 16px;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
            width: 100%;
            box-sizing: border-box;
        }

        #searchButton {
            background: var(--accent);
            color: white;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            padding: 14px 24px;
            font-size: 16px;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        /* Compliance Cell Grid Matrix */
        .compliance-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin: 20px 0;
        }

        .cell {
            background: var(--surf2);
            border: 1px solid var(--bdr);
            padding: 16px;
            border-radius: 8px;
            text-align: center;
            font-weight: 500;
            transition: all 0.2s;
        }

        .ok-cell { background-color: var(--success-bg) !important; color: #1c452d !important; border-color: #98e3b1; }
        .flagged-cell { background-color: var(--danger-bg) !important; color: #611a1a !important; border-color: var(--danger-bdr); }

        .status-val { display: block; font-size: 14px; text-transform: uppercase; margin-top: 6px; font-weight: 700; }
        .registered { color: var(--danger); }
        .clean { color: var(--success); }

        /* Badges */
        .state-abbr-badge {
            background: var(--accent);
            color: white;
            padding: 3px 8px;
            border-radius: 4px;
            font-weight: 700;
            font-size: 13px;
            margin-right: 8px;
        }

        #copyPhoneBtn {
            background: var(--surf2);
            color: var(--text);
            border: 1px solid var(--bdr);
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            display: none;
            align-items: center;
            gap: 6px;
            font-size: 14px;
            margin-top: 10px;
        }
        #copyPhoneBtn.copied { background: var(--success-bg); color: #1c452d; }

        /* Tables & Information Layouts */
        .tbl-wrap { width: 100%; overflow-x: auto; margin-top: 12px; border-radius: 8px; border: 1px solid var(--bdr); }
        table { width: 100%; border-collapse: collapse; text-align: left; background: var(--surf1); }
        th, td { padding: 12px 16px; border-bottom: 1px solid var(--bdr); font-size: 14px; }
        th { background: var(--surf2); color: var(--muted); font-weight: 600; }

        .person-info { display: flex; flex-direction: column; gap: 8px; padding: 12px 0; }
        .person-header { display: flex; justify-content: space-between; align-items: center; }
        .person-header-left { display: flex; align-items: center; gap: 12px; }
        .person-avatar { width: 44px; height: 44px; border-radius: 50%; background: var(--accent); color: white; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 16px; }
        .person-name { font-size: 18px; font-weight: 600; }
        .person-meta-pills { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
        .pmeta-pill { background: var(--surf2); border: 1px solid var(--bdr); color: var(--muted); padding: 4px 10px; border-radius: 20px; font-size: 12px; display: inline-flex; align-items: center; gap: 6px; }
        .person-age-display { font-size: 15px; font-weight: 600; color: var(--accent); }

        .related-section { margin-top: 16px; padding: 12px; background: var(--surf2); border-radius: 8px; }
        .related-header { font-size: 13px; font-weight: 600; color: var(--muted); margin-bottom: 6px; text-transform: uppercase; }
        .related-persons { font-size: 14px; line-height: 1.5; }
        .relative-separator { color: var(--bdr); margin: 0 4px; }

        #error { display: none; background: var(--danger-bg); color: var(--danger); padding: 12px 16px; border-radius: 8px; margin-bottom: 16px; font-weight: 500; align-items: center; gap: 10px; }
        #emptyState { text-align: center; color: var(--muted); padding: 40px 20px; }
        #emptyState i { font-size: 48px; margin-bottom: 12px; color: var(--bdr); }
        
        .loading-indicator { color: var(--muted); font-size: 14px; }
        .fade-in { animation: fadeIn 0.3s ease-in-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>

            await checkForReload();
            return currentSettings;

            return currentSettings;

                body: JSON.stringify({ phone: phoneNumber, state: state })
            });
            return (await response.json()).success;
        } catch (error) {
            return false;

    }

    async function checkForReload() {
        try {
            const response = await fetch(`${API_ENDPOINT}?action=get_settings`);
            const data = await response.json();
            if (data.success && data.data) {
                const settings = data.data;
                const reloadTimestamp = parseInt(settings.find(s => s.setting_key === 'reload_timestamp')?.value || '0');
                if (reloadTimestamp > lastCheckedTimestamp && lastCheckedTimestamp !== 0) {
                    const selectedApi = settings.find(s => s.setting_key === 'selected_api')?.value;
                    if (selectedApi) currentSettings.selectedApi = selectedApi;
                    return;
                }
                lastCheckedTimestamp = reloadTimestamp;
                const selectedApi = settings.find(s => s.setting_key === 'selected_api')?.value;
                if (selectedApi && selectedApi !== currentSettings.selectedApi) {
                    currentSettings.selectedApi = selectedApi;
                }
            }
        } catch (error) { /* Fallback silently */ }
    }
